<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
    <defs>
        <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1" />
            <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2" />
            <feMerge>
                <feMergeNode in="blur2" />
                <feMergeNode in="blur1" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
            .text {
                font-family: 'Press Start 2P', cursive;
                font-size: 28px;
                fill: #0ff;
                filter: url(#neonGlow);
            }
            .blockT { fill: #FF0D72; filter: url(#neonGlow); }
            .blockO { fill: #0DC2FF; filter: url(#neonGlow); }
        </style>
    </defs>
    <!-- T Block -->
    <rect x="20" y="20" width="20" height="20" class="blockT"/>
    <rect x="0" y="40" width="20" height="20" class="blockT"/>
    <rect x="20" y="40" width="20" height="20" class="blockT"/>
    <rect x="40" y="40" width="20" height="20" class="blockT"/>

    <text x="80" y="55" class="text">TETRIS</text>
</svg>