<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tetris</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Modal Input Name -->
    <div id="name-modal" class="modal">
        <div class="modal-content">
            <img src="logo.svg" alt="Tetris Logo" class="modal-logo">
            <h2>ENTER YOUR NAME</h2>
            <input type="text" id="player-name-input" maxlength="10" placeholder="Player1">
            <button id="save-name-btn">START GAME</button>
        </div>
    </div>

    <!-- Modal Game Over -->
    <div id="game-over-modal" class="modal" style="display: none;">
        <div class="modal-content game-over-content">
            <h1 class="game-over-text">GAME OVER</h1>
            <div class="final-score-box">
                <div class="score-label">FINAL SCORE</div>
                <div id="final-score" class="score-value">0</div>
            </div>
            <button id="play-again-btn">PLAY AGAIN</button>
            <button id="change-name-btn">CHANGE NAME</button>
        </div>
    </div>

    <div class="game-container">
        <canvas id="tetris" width="240" height="400"></canvas>
        <div class="side-panel">
            <div class="title-container">
                <img src="logo.svg" alt="Tetris Logo" class="side-logo">
            </div>
            <div class="player-info">
                <div class="score-label">PLAYER</div>
                <div id="display-name" class="score-value">Unknown</div>
            </div>
            <div class="score-box">
                <div class="score-label">SCORE</div>
                <div id="score" class="score-value">0</div>
            </div>
            <div class="score-box high-score-box">
                <div class="score-label">TOP SCORES</div>
                <ul id="leaderboard-list">
                    <!-- Leaderboard items injected via JS -->
                </ul>
            </div>
            <button id="start-btn">PLAY</button>
        </div>
    </div>

    <!-- Mobile Controls -->
    <div id="mobile-controls" class="mobile-controls">
        <div class="control-row">
            <button id="btn-up" class="ctrl-btn">ROTATE</button>
        </div>
        <div class="control-row">
            <button id="btn-left" class="ctrl-btn">&larr;</button>
            <button id="btn-down" class="ctrl-btn">&darr;</button>
            <button id="btn-right" class="ctrl-btn">&rarr;</button>
        </div>
    </div>

    <!-- Watermark -->
    <div class="watermark">creator by ashabul kahfi anwar</div>

    <script src="script.js"></script>
</body>
</html>
